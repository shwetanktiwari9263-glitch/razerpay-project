spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
# Local-only test mode. Keep false in deployed environments.
app.webhook.allow-unsigned=${ALLOW_UNSIGNED_WEBHOOKS:false}
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
ml.service.enabled=${ML_SERVICE_ENABLED:false}
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# Re-enable database auto-configuration for the MySQL profile.
spring.autoconfigure.exclude=
# Initialise the idempotent RecoverFlow schema for a fresh MySQL deployment.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-mysql.sql
